 <title>Произведение производных задаёт дальность обучения</title><desc>Логарифм нормы градиента по временному лагу для трёх спектральных радиусов. По горизонтали лаг $T-t$, по вертикали $\log_{10}\|\partial h_T/\partial h_t\|$. Кривые для эффективных множителей $0{,}8$, $1{,}0$, $1{,}15$ показывают исчезновение, сохранение и взрыв. Горизонтальная полоса отмечает диапазон численной различимости.</desc><metadata>
