 <title>Одна ячейка, развёрнутая во времени</title><desc>Рекуррентная ячейка и её развёртка на пять временных шагов. Слева RNN изображена циклом, справа тот же расчёт развёрнут в пять копий. Одинаковый цвет матриц показывает общие параметры. Толщина горизонтальной стрелки условно показывает, какая часть импульса первого входа остаётся в $h_t$.</desc><metadata>
