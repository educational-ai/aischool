    <dc:title>Блочное умножение и повторное использование</dc:title>
    <dc:date>2026-07-18T11:03:01.978732</dc:date>
    <dc:description>Матрицы разбиты на плитки, выделены A_IK B_KJ C_IJ, стрелки загрузки в схематичный cache и график времени от размера блока. Левая часть показывает один шаг по блокам. Правая напоминает, что слишком малый блок теряет эффективность, слишком большой перестаёт помещаться в кэш.</dc:description>
