 <title>Победа над предшественником скрывает цикл</title><desc>Матрица результатов трёх стратегий и циклический граф доминирования. Слева дана матрица win rate, справа стрелки показывают отношение «побеждает чаще 50%». Упорядочить вершины сверху вниз невозможно: граф содержит цикл. Серый столбец «против смеси» даёт другой, более устойчивый итог.</desc><metadata>
