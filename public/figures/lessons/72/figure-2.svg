 <title>Одна итерация дерева MCTS по шагам</title><desc>Дерево игры с этапами selection expansion evaluation backup. Красный путь показывает selection по PUCT, новый узел обведён, рядом сеть выдаёт value и priors. Синие стрелки backup возвращают значение с чередующимся знаком. У рёбер подписаны $(N,Q,P)$ до и после итерации.</desc><metadata>
