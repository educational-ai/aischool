    <dc:date>2026-07-18T11:02:57.933697</dc:date>
    <dc:description>Матрица изображения с вертикальной границей, окно 5 на 5, ядро с отрицательными и положительными весами, произведения и сумма. Каждой клетке окна соответствует клетка ядра. Под схемой три числовых примера сравнивают однородную область, вертикальный и горизонтальный края.</dc:description>
