 <title>Два минимальных рассказа о XOR</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Два минимальных рассказа о XOR</dc:title>
    <dc:date>2026-07-18T11:02:52.720427</dc:date>
    <dc:description>Две параллельные схемы пороговых сетей XOR с логическими подписями скрытых нейронов и общей таблицей истинности. Одинаковые четыре ответа получаются через «хотя бы один, но не оба» и через «первый без второго или второй без первого». Рисунок показывает, что вычислительная эквивалентность не делает внутренние признаки одинаковыми.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.9.4, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
