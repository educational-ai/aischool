 <title>Query адресует, value переносит</title><desc>Схема вычисления внимания для одного слова с запросами ключами значениями и весами. Запрос слова `он` сравнивается с ключами всех позиций. Толщина линий равна $a_{ij}$; в сумматор поступают value, а не ключи. Справа показан численный пример трёх scores, softmax и результирующей смеси.</desc><metadata>
