 <title>Полная и причинная карта</title><desc>Две матрицы attention для предложения, одна полная, другая с треугольной маской. Оси обеих тепловых карт подписаны токенами. Слева позиции видят весь текст, справа верхний треугольник запрещён. Строка для последнего доступного токена показывает, как нормировка перераспределяет массу после маски.</desc><metadata>
