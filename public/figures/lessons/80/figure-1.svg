 <title>Разность скрытых баллов становится вероятностью</title><desc>Логистическая кривая Bradley Terry с отмеченными разностями scores. По горизонтали $r_i-r_j$, по вертикали $\Pr(i\succ j)$. Отмечены вероятности 0,5, 0,75 и 0,9. Симметрия вокруг нуля показывает $\Pr(j\succ i)=1-\Pr(i\succ j)$.</desc><metadata>
