<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:ns4="http://www.w3.org/1999/xlink" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="662.4pt" height="377.76pt" viewBox="0 0 662.4 377.76" version="1.1" role="img">
 <title>Оптимизация reward выходит за область разметки</title><desc>Связь reward model score и человеческой оценки до и после сильной оптимизации. Синие точки обычных ответов лежат в обученном диапазоне и растут вместе с человеческой оценкой. Красная траектория оптимизации уходит вправо: score продолжает расти, оценка людей выходит на плато и падает. Вертикальная полоса отмечает максимум train scores.</desc><metadata>
