 <title>Тонкий мост делает рейтинг хрупким</title><desc>Граф сравнений с двумя плотными сообществами и одним мостом, интервалы scores. Размер вершины равен числу сравнений, цвет — fitted score, полупрозрачная дуга — повторные голоса. У вершин по разные стороны единственного моста интервалы широки. После добавления трёх перекрёстных рёбер справа интервалы сужаются.</desc><metadata>
