 <title>Путь памяти через ячейку LSTM</title><desc>Схема LSTM с forget input output gates и потоками состояния. Горизонтальная синяя линия — $c_{t-1}\to c_t$, умножение на $f_t$ отмечено затвором. Зелёная ветвь добавляет $i_t\widetilde c_t$, нижняя ветвь формирует $h_t$. Под схемой те же операции показаны для одной координаты численно.</desc><metadata>
