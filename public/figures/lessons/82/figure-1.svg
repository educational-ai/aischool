 <title>Две выборки входят в одну проверку</title><desc>Схема GAN с шумом генератором реальными данными discriminator и двумя градиентами. Синие реальные объекты и красные $G(z)$ поступают в discriminator. Сплошная обратная стрелка обновляет $D$ по двум классам; пунктирная проходит через замороженный на этом шаге $D$ к $G$. Знаки stop-gradient разделяют два обновления.</desc><metadata>
