    <dc:description>Три RGB-матрицы, три ядра, карты частичных свёрток и их сумма со смещением в одну карту признака. Каждая входная карта имеет собственное ядро. Правая панель отделяет три частичных вклада от итоговой суммы и активации.</dc:description>
