 <title>Код входит в генератор на нескольких масштабах</title><desc>Архитектурная схема StyleGAN mapping z to w and style modulation at resolutions. Слева $z$ проходит mapping network и даёт $w$. Справа synthesis растёт от $4\times4$ до $1024\times1024$; одинаковый $w$ через разные affine-блоки управляет слоями. Крупные и мелкие признаки подписаны у соответствующих разрешений.</desc><metadata>
