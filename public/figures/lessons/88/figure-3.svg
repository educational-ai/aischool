 <title>Один префикс, три вмешательства</title><desc>World model rollout from same initial state under left straight right actions. Верхняя строка — общий наблюдаемый префикс. Три ветви получают разные steering actions; нанесены траектории, uncertainty cones и predicted collision risk. Серым показан недоступный в train участок, где uncertainty растёт.</desc><metadata>
