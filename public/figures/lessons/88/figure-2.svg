 <title>Один 3D-объект связывает два изображения</title><desc>Две камеры, 3D точка, rays, image planes and epipolar line. Точка $X$ проецируется в $u_1,u_2$. Луч первой камеры и baseline задают epipolar plane; на второй плоскости соответствие лежит на линии. Рядом показана ошибочная генерация, где matching point нарушает constraint.</desc><metadata>
