 <title>Один смысл расходует разный контекст</title><desc>Число токенов параллельных предложений на восьми языках. Для каждого языка показано распределение числа токенов на 1 000 параллельных предложениях. Горизонтальная ось — токены на 100 Unicode-символов, точки — медианы, полосы — 10–90 процентили. Отдельным цветом отмечены языки, плохо представленные в обучающей смеси словаря.</desc><metadata>
