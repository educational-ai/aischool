 <title>Видимый знак и последовательность кодов</title><desc>Unicode разбор букв и emoji по code points bytes и токенам. Для трёх визуальных фрагментов показаны code points, UTF-8 bytes и итоговые токены до и после NFC. Стрелки отмечают места, где одинаковый вид не означает одинаковые данные, а один glyph состоит из нескольких кодов.</desc><metadata>
