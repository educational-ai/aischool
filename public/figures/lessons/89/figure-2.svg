 <title>Проверка должна замыкаться на внешний критерий</title><desc>Plan execute verify loop with unit test file parser and human approval evidence. Три ветви verifier-а показывают test output, schema validation и human approval. Стрелка назад содержит конкретную ошибку, а не общий запрос «попробуй ещё». Успешная остановка требует выполненных критериев и остатка бюджета.</desc><metadata>
