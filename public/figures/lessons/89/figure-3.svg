 <title>Доверие не совпадает с порядком текста</title><desc>Agent trust boundaries user instruction web page secret store and outbound tool. Потоки данных имеют метки trusted/untrusted. Веб-страница входит как observation и не получает прямого ребра к outbound tool. Secret store доступен только отдельному узкому действию; policy gate проверяет destination и user intent.</desc><metadata>
