 <title>Агент работает циклом, а не облаком</title><desc>State machine of agent plan tool observation verify stop. Узлы обозначают состояния `план`, `вызов`, `наблюдение`, `проверка`, `ответ`; стрелки имеют условия перехода и расход бюджета. Ошибочный observation ведёт не сразу к ответу, а в ветвь проверки. Красным отмечены необратимые actions.</desc><metadata>
