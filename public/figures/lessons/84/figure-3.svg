 <title>Domain shift поворачивает соседей</title><desc>Retrieval results for web CLIP and satellite fine tuned model on remote sensing query. Для одного спутникового query показаны top-5 captions до и после domain fine-tuning. Под каждой карточкой similarity; цвет рамки обозначает предметную релевантность по ручной разметке. Справа — Recall@K по регионам и сезонам.</desc><metadata>
