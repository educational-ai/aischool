 <title>Batch превращается в матрицу сопоставлений</title><desc>Матрица cosine similarities изображений и текстов с диагональными positives. Строки — изображения, столбцы — подписи. Диагональ отмечена как positive, один off-diagonal яркий элемент — false negative: другая подпись тоже подходит. Справа показан softmax одной строки при двух температурах.</desc><metadata>
