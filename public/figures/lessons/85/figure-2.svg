 <title>Случайность вынесена за вычислительный путь</title><desc>Схема encoder mu log variance epsilon reparameterization decoder. Encoder выдаёт $\mu$ и $\log\sigma^2$, независимый $\varepsilon$ входит через умножение и сложение. Красные стрелки gradient проходят через $z$ к обоим выходам encoder; sampling-узел $\varepsilon$ параметров не имеет.</desc><metadata>
