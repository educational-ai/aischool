    <dc:title>Три уровня доступа к данным</dc:title>
    <dc:date>2026-07-18T11:02:59.833375</dc:date>
    <dc:description>Конвейер train обновляет веса, validation выбирает конфигурацию, закрытый test выдаёт отчёт; красные запрещённые стрелки назад. Сплошные стрелки показывают разрешённый поток информации. Красная стрелка от test к выбору модели превращает его в ещё одну validation-часть.</dc:description>
