 <title>Вложенная кросс-валидация</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Вложенная кросс-валидация</dc:title>
    <dc:date>2026-07-18T11:03:00.020510</dc:date>
    <dc:description>Пять внешних folds, внутри каждого четыре train и один validation для выбора, внешний holdout для оценки, итоговое распределение. В каждом внешнем шаге весь внутренний подбор повторяется с нуля. Правая панель показывает не один лучший score, а пять независимых оценок процедуры.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.9.4, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
