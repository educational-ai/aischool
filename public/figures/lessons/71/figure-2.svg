<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="662.4pt" height="377.76pt" viewBox="0 0 662.4 377.76" version="1.1" role="img">
 <title>Почему DQN разделяет текущую и целевую сети</title><desc>Поток перехода через replay buffer, Q-сеть и target-сеть. Переход из среды попадает в буфер. Текущая сеть вычисляет $Q_\theta(s,a)$, замороженная target-сеть — bootstrap-часть цели. Пунктирная стрелка показывает периодическое копирование параметров; отсутствие прямого градиента через target подчёркнуто знаком остановки.</desc><metadata>
