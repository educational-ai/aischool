 <title>TD-ошибка переносит новость назад</title><desc>Цепочка состояний с наградами и последовательными обновлениями ценности. Цель впервые достигнута справа. В первом эпизоде положительная TD-ошибка возникает у последнего перехода; в следующих эпизодах сигнал распространяется к более ранним состояниям. Толщина стрелок соответствует $Q(s,a)$, цвет — знаку последнего обновления.</desc><metadata>
