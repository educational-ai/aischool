 <title>Гладкая вероятность и ступенчатая accuracy</title><desc>Вероятность правильного ответа и exact-match accuracy по масштабу модели. Верхняя кривая показывает плавный рост среднего probability правильного варианта. Нижняя exact-match пересекает порог выбора и выглядит скачком. Точки соответствуют тем же моделям; фигура объясняет, как метрика создаёт видимость emergence.</desc><metadata>
