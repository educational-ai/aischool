 <title>Подстановка сохраняет рисунок повторов</title><desc>Открытая фраза, таблица ключа и шифротекст с соединёнными повторяющимися буквами. Верхняя строка — фрагмент открытого текста, средняя — таблица замен букв, нижняя — шифротекст. Дуги соединяют одинаковые позиции до и после шифрования. Цветом отмечены биграммы: сами символы меняются, но число и взаимное расположение повторов остаются.</desc><metadata>
