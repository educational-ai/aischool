 <title>Энергетический рельеф перестановок</title><desc>Схема локальных максимумов балла ключей и две траектории жадного поиска и MCMC. Узлы изображают ключи, рёбра — обмен двух букв, высота — языковой балл $L$. Красная жадная траектория останавливается на локальном пике; синяя цепь принимает один шаг вниз и достигает более высокого пика. Под узлами приведены короткие фрагменты расшифровок.</desc><metadata>
