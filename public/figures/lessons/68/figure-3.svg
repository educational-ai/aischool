<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:ns4="http://www.w3.org/1999/xlink" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="662.4pt" height="377.76pt" viewBox="0 0 662.4 377.76" version="1.1" role="img">
 <title>Длина шифротекста и восстановимость ключа</title><desc>Кривые точности восстановления букв для униграммной биграммной и триграммной моделей при разной длине текста. По горизонтали длина шифротекста от 50 до 2 000 символов, по вертикали доля правильно восстановленных пар ключа среди встретившихся букв. Линии показывают медианы 30 синтетических опытов, полосы — межквартильный диапазон. Видно, когда более сложная модель начинает окупать разреженность.</desc><metadata>
