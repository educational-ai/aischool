    <dc:date>2026-07-18T11:02:57.309682</dc:date>
    <dc:description>Матрицы x W z h и incoming gradient с размерами, операции elementwise product, outer product и transpose multiplication. Схема выравнивает прямые и обратные тензоры по форме. Одинаковым цветом отмечены величины, которые должны совпадать размером, включая параметры и их градиенты.</dc:description>
