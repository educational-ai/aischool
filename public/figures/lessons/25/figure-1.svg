  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Прямые значения и обратные чувствительности</dc:title>
    <dc:date>2026-07-18T11:02:57.202359</dc:date>
    <dc:description>Граф a равно xy, b равно x плюс y, c равно a squared, L равно c плюс b; на рёбрах локальные производные, у узлов значения и adjoints. Чёрные подписи показывают прямой расчёт, цветные идут от $L$ назад. В узле $x$ два пути встречаются, поэтому его итоговая производная является суммой.</dc:description>
