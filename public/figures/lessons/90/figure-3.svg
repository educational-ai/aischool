 <title>Средняя метрика распадается на режимы</title><desc>Performance dashboard by season missingness and target prevalence with error examples. Общая PR-AUC разбита по сезонам и доле пропусков. Размер точки показывает число объектов, полосы — bootstrap intervals. Справа две уверенные ошибки связаны стрелками с соответствующими группами и проверяемыми гипотезами.</desc><metadata>
