 <title>От расплывчатой темы к проверяемому вопросу</title><desc>Воронка проектной постановки тема решение данные target metric threshold action. Слева широкие темы `город`, `здоровье`, `язык`; каждое уточнение добавляет наблюдаемую переменную и ограничение. Справа одна карточка question contract со временем прогноза, baseline, метрикой и действием пользователя.</desc><metadata>
