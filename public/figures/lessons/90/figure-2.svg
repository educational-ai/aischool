 <title>Проект как цепь артефактов и проверок</title><desc>Pipeline data snapshot split baseline model error audit interactive report with reviewer gates. У каждого этапа указан артефакт: checksum snapshot, split manifest, metrics table, error gallery, browser lab. Ромбы reviewer gate имеют бинарные критерии. Красная обратная стрелка разрешает пересборку, но запрещает подглядывать в test.</desc><metadata>
