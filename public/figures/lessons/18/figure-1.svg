    <dc:title>Прямой проход с формами тензоров</dc:title>
    <dc:date>2026-07-18T11:02:53.476854</dc:date>
    <dc:description>Изображение 5 на 5, вектор длины 25, матрица W 4 на 25, четыре скрытых активации, матрица V 2 на 4 и два логита. Под каждой стрелкой указана операция, над каждым объектом — его форма. Один выделенный пиксель прослеживается по четырём весам до вкладов в оба выходных логита.</dc:description>
