 <title>Утечка поднимает метрику без нового навыка</title><desc>Accuracy модели на оригинальных и переформулированных задачах при разной доле загрязнения train. По горизонтали доля benchmark-документов или близких копий в train. Синяя линия — исходные вопросы, зелёная — новые числовые варианты той же структуры. Разрыв растёт с загрязнением и служит диагностикой memorization.</desc><metadata>
