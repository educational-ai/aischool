 <title>Фильтры меняют карту корпуса</title><desc>Поток документов через язык качество дедупликацию и итоговую смесь. Ширина потоков равна числу токенов. После каждого фильтра показано, какие жанры теряются. Отдельная ветвь near-duplicates объединяет зеркала; справа исходные доли сопоставлены с итоговыми весами training mixture.</desc><metadata>
