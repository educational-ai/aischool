 <title>Документ становится сдвинутой таблицей целей</title><desc>Токены документа, causal mask и target следующего токена. Верхняя строка — входные токены, нижняя сдвинута на одну позицию и содержит targets. Треугольная сетка показывает доступный контекст. Красным отмечен ошибочный вариант, где target виден во входе той же позиции.</desc><metadata>
