 <title>Редкая подделка превращает флаги в ложные тревоги</title><desc>Дерево из 10000 файлов с real fake detector outcomes and predictive value. Из 10 000 файлов 100 поддельны: 90 найдены, 10 пропущены; из 9 900 настоящих 495 ошибочно помечены. Цветные блоки позволяют увидеть знаменатель: среди 585 тревог истинны только 90.</desc><metadata>
