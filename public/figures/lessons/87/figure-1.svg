 <title>Маска, контекст и невидимая область правки</title><desc>Исходное изображение binary mask inpainting result and difference map. Четыре панели показывают исходник, маску, результат и $|\widehat x-x|$. Контур маски наложен на difference map: изменения вне него измеримы. Отдельно отмечены тень и отражение как спорные элементы контракта.</desc><metadata>
