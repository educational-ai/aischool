 <title>Проверка как дерево свидетельств</title><desc>Decision flow provenance signature watermark detector source corroboration human review. Схема не выдаёт бинарный приговор из detector score. Ветви подписаны типом свидетельства и возможным отказом: подпись отсутствует, watermark повреждён, classifier вне домена. Финал — уровни уверенности и действие, а не ярлык «фейк».</desc><metadata>
