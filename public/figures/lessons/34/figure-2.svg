    <dc:description>Энкодер-декодер с формами карт, растущим рецептивным полем, skip connections и примерами ранней границы и глубокого класса. Нижние подписи показывают пространственный размер и каналы. Два цвета стрелок разделяют глубокий контекст и высокочастотную информацию о границе.</dc:description>
