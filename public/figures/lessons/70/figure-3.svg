 <title>Одна средняя скрывает два контекста</title><desc>Вероятности клика двух вариантов для новых и постоянных читателей. Столбцы показывают CTR вариантов $A$ и $B$ отдельно для новых и постоянных читателей. В общей смеси побеждает $A$, но внутри обеих групп — $B$: доли аудиторий при показах различались. Схема связывает контекстный выбор с парадоксом Симпсона.</desc><metadata>
