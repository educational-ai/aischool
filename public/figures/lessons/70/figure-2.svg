 <title>Среднее плюс неопределённость</title><desc>Доверительные интервалы трёх рук и выбор UCB. Для каждой руки точка показывает $\widehat\mu_a$, вертикальный отрезок — бонус $c\sqrt{\log t/N_a}$. У третьей руки среднее ниже, но верхняя граница выше остальных, поэтому следующий показ достаётся ей. Числа $N_a$ подписаны под осью.</desc><metadata>
