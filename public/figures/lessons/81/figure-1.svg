 <title>Пять контуров alignment pipeline</title><desc>Поток pretrained model SFT preferences reward optimization evaluation. Стрелки различают данные и параметры. Замороженные блоки показаны контуром: reference и evaluation set не обновляются. Красная обратная стрелка от production-аудита к сбору данных показывает итеративность, но test-примеры не попадают в train.</desc><metadata>
