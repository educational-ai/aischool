 <title>PPO и DPO используют один сигнал разными маршрутами</title><desc>Параллельные схемы PPO online sampling reward critic и DPO offline preference pairs. Слева PPO замыкает online-цикл генерации, scoring и обновления. Справа DPO получает замороженные пары и reference log-probabilities. Общая нижняя ось показывает сдвиг log-odds chosen против rejected и ограничение reference.</desc><metadata>
