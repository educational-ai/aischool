 <title>Грамматика блока трансформера</title><desc>Схема pre-norm transformer block с attention MLP residual и размерностями. Поток $n\times d$ разветвляется перед каждым подслоем: одна ветвь проходит без изменений, вторая через LN и MHA или MLP. Знаки сложения показывают residual. На полях подписано, где взаимодействуют позиции, а где только каналы.</desc><metadata>
