 <title>Один выбор разворачивает дерево будущего</title><desc>Дерево переходов курьера с действиями, вероятностями, наградами и объединёнными состояниями. Квадраты обозначают состояния, цветные стрелки — действия, подписи на ветвях — $P(s'\mid s,a)$ и немедленные награды. Одинаковые состояния на втором уровне объединены: MDP хранит состояние, а не всю историю пути.</desc><metadata>
