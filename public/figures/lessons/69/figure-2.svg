 <title>Как ценность распространяется от цели</title><desc>Последовательность тепловых карт ценности на сетке и стрелки оптимальной стратегии. Панели соответствуют итерациям $k=0,1,2,8$. Зелёная клетка даёт награду, красные клетки опасны, стены непроходимы. Волна ненулевой ценности расходится на один шаг за итерацию; итоговые стрелки показывают policy, а не одну траекторию.</desc><metadata>
